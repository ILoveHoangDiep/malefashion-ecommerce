server:
  port: ${PAYMENT_SERVICE_PORT:8086}

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${PAYMENT_DB_NAME:payment_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

payment:
  outbox:
    publish-interval-ms: ${PAYMENT_OUTBOX_PUBLISH_INTERVAL_MS:500}
  messaging:
    consumer-name: payment-service
    retry:
      max-attempts: ${PAYMENT_MESSAGE_MAX_ATTEMPTS:3}
      initial-interval-ms: 500
      multiplier: 2.0
      max-interval-ms: 5000
  mock:
    honor-scenario: ${PAYMENT_MOCK_HONOR_SCENARIO:false}
    silent-on-timeout: ${PAYMENT_MOCK_SILENT_ON_TIMEOUT:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
