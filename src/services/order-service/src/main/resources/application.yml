server:
  port: ${ORDER_SERVICE_PORT:8084}

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${ORDER_DB_NAME:order_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

order:
  saga:
    timeout: ${ORDER_SAGA_TIMEOUT:PT10M}
    compensation-timeout: ${ORDER_COMPENSATION_TIMEOUT:PT2M}
    refund-max-retries: ${ORDER_REFUND_MAX_RETRIES:2}
    refund-retry-backoff: ${ORDER_REFUND_RETRY_BACKOFF:PT1M}
    refund-retry-backoff-multiplier: ${ORDER_REFUND_RETRY_BACKOFF_MULTIPLIER:2.0}
  shipping-fee: ${ORDER_SHIPPING_FEE:30000.00}
  timeout-scan-interval-ms: ${ORDER_TIMEOUT_SCAN_INTERVAL_MS:5000}
  # Không có default: service chỉ khởi động khi biến môi trường ORDER_INTERNAL_API_KEY được cấu hình.
  internal-api-key: ${ORDER_INTERNAL_API_KEY}
  cart-base-url: ${ORDER_CART_BASE_URL:http://cart-coupon-service:8083}
  catalog-base-url: ${ORDER_CATALOG_BASE_URL:http://catalog-service:8082}
  mock-scenario-enabled: ${ORDER_MOCK_SCENARIO_ENABLED:false}
  outbox:
    publish-interval-ms: ${ORDER_OUTBOX_PUBLISH_INTERVAL_MS:500}
    publisher:
      # Mặc định bật scheduler; test chỉ có PostgreSQL tắt để không gọi broker thật.
      enabled: ${ORDER_OUTBOX_PUBLISHER_ENABLED:true}
  messaging:
    consumer-name: order-service
    listener:
      # Mặc định bật listener; test chỉ có PostgreSQL tắt để không consume event thật.
      auto-startup: ${ORDER_MESSAGING_LISTENER_AUTO_STARTUP:true}
    retry:
      max-attempts: ${ORDER_MESSAGE_MAX_ATTEMPTS:3}
      initial-interval-ms: 500
      multiplier: 2.0
      max-interval-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
